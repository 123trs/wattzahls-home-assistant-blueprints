blueprint:
  name: "WATTZAHLS.DE – Nachtlicht bei Bewegung"
  description: >
    Schaltet bei Bewegung innerhalb eines Nacht-Zeitfensters ein Licht gedimmt ein
    und nach Ende der Bewegung plus Nachlauf wieder aus.
  domain: automation
  source_url: https://github.com/123trs/wattzahls-home-assistant-blueprints/blob/main/automation/nachtlicht-bei-bewegung.yaml
  author: WATTZAHLS.DE
  input:
    motion_entity:
      name: Bewegungssensor
      description: Bewegungs- oder Präsenzsensor für das Nachtlicht.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy
    light_target:
      name: Nachtlicht
      description: Licht, das gedimmt eingeschaltet werden soll.
      selector:
        target:
          entity:
            domain: light
    start_time:
      name: Startzeit
      default: "22:00:00"
      selector:
        time:
    end_time:
      name: Endzeit
      default: "06:00:00"
      selector:
        time:
    brightness_pct:
      name: Helligkeit
      description: Helligkeit des Nachtlichts in Prozent.
      default: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    no_motion_wait:
      name: Nachlauf
      description: Sekunden nach Ende der Bewegung bis zum Ausschalten.
      default: 45
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"

conditions:
  - condition: time
    after: !input start_time
    before: !input end_time

actions:
  - alias: "Nachtlicht einschalten"
    action: light.turn_on
    target: !input light_target
    data:
      brightness_pct: !input brightness_pct
  - alias: "Auf Bewegungsende warten"
    wait_for_trigger:
      - trigger: state
        entity_id: !input motion_entity
        from: "on"
        to: "off"
  - alias: "Nachlauf abwarten"
    delay:
      seconds: !input no_motion_wait
  - alias: "Nachtlicht ausschalten"
    action: light.turn_off
    target: !input light_target
